<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>froHEN</title>
<style>
  :root{
    --bg:#07090c;
    --panel:#0e1218;
    --panel2:#131923;
    --line:#1c2530;
    --txt:#c9d3df;
    --dim:#7c8897;
    --faint:#4a5563;
    --ice:#7fd0ff;
    --ice2:#5aa9e6;
    --ok:#7fd0a0;
    --bad:#e08a7f;
    --warn:#e6c07f;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;
    min-height:100%;
    background:
      radial-gradient(1200px 600px at 50% -20%, #12202e 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 120%, #0f1a24 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    font:15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px 18px 0;
  }

  #brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:26px;
    user-select:none;
  }
  #brand .mark{
    width:46px;height:46px;
    border-radius:14px;
    background:linear-gradient(145deg,var(--ice) 0%,var(--ice2) 55%,#2f6ea8 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      0 0 0 1px rgba(127,208,255,.25),
      0 10px 30px -10px rgba(127,208,255,.55),
      inset 0 1px 0 rgba(255,255,255,.35);
    position:relative;
  }
  #brand .mark::after{
    content:"";
    position:absolute;inset:0;
    border-radius:14px;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.45), transparent 55%);
  }
  #brand .mark svg{
    width:24px;height:24px;
    color:#06121c;
    position:relative;z-index:1;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.15));
  }
  #brand .name{
    font-size:22px;
    font-weight:800;
    letter-spacing:.02em;
    color:#eef4fa;
    line-height:1;
  }
  #brand .name span{color:var(--ice)}
  #brand .tag{
    font-size:11px;
    letter-spacing:.18em;
    color:var(--faint);
    text-transform:uppercase;
    margin-top:5px;
  }

  #wrap{
    width:100%;
    max-width:440px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 24px 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.02) inset,
      0 30px 60px -30px rgba(0,0,0,.8);
    position:relative;
    overflow:hidden;
  }
  #wrap::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--ice),transparent);
    opacity:.5;
  }

  #state{
    font-size:20px;
    font-weight:700;
    margin:0 0 8px;
    color:#eef4fa;
    letter-spacing:.01em;
    line-height:1.25;
  }
  #state.warn{color:var(--warn)}
  #state.bad{color:var(--bad)}
  #state.ok{color:var(--ok)}

  #det{
    font-size:13px;
    color:var(--dim);
    margin:0 0 3px;
    line-height:1.5;
  }
  #det b{color:var(--txt);font-weight:600}

  #cache{
    font-size:12px;
    color:var(--faint);
    min-height:16px;
    margin-top:10px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    letter-spacing:.02em;
  }
  #cache.cacheok{color:var(--ok)}

  #dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--dim);
    margin-right:9px;
    vertical-align:middle;
    position:relative;
    top:-1px;
    box-shadow:0 0 0 3px rgba(124,136,151,.12);
    transition:background .25s, box-shadow .25s;
  }
  #dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(230,192,127,.15)}
  #dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(224,138,127,.15)}
  #dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(127,208,160,.15)}

  /* ── button ── */
  #jb{
    display:none;
    width:100%;
    margin-top:20px;
    padding:18px 22px;
    border:none;
    border-radius:14px;
    background:linear-gradient(145deg,var(--ice) 0%,var(--ice2) 55%,#2f6ea8 100%);
    color:#04121c;
    font:700 17px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing:.14em;
    text-transform:uppercase;
    cursor:pointer;
    position:relative;
    box-shadow:
      0 0 0 1px rgba(127,208,255,.35),
      0 14px 34px -12px rgba(127,208,255,.6),
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -2px 0 rgba(0,0,0,.15);
    transition:transform .12s, box-shadow .2s, filter .2s;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    outline:none;
  }
  #jb.show{display:block}
  #jb:hover{
    filter:brightness(1.05);
    box-shadow:
      0 0 0 1px rgba(127,208,255,.5),
      0 18px 40px -12px rgba(127,208,255,.75),
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -2px 0 rgba(0,0,0,.15);
  }
  #jb:active{
    transform:translateY(1px) scale(.995);
    box-shadow:
      0 0 0 1px rgba(127,208,255,.4),
      0 8px 20px -10px rgba(127,208,255,.55),
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 0 2px 4px rgba(0,0,0,.25);
  }
  #jb:disabled{
    filter:grayscale(.6) brightness(.7);
    cursor:default;
    pointer-events:none;
  }
  #jb .ico{
    display:inline-block;
    vertical-align:middle;
    width:16px;height:16px;
    margin-right:10px;
    position:relative;
    top:-1px;
  }
  #jb .lbl{vertical-align:middle}

  #hint{
    display:none;
    margin-top:12px;
    font-size:12px;
    color:var(--faint);
    text-align:center;
    letter-spacing:.03em;
  }
  #hint.show{display:block}

  #foot{
    margin-top:auto;
    padding:22px 0 20px;
    text-align:center;
    font-size:12px;
    color:var(--faint);
    letter-spacing:.04em;
  }
  #foot a{
    color:var(--dim);
    text-decoration:none;
    border-bottom:1px dashed transparent;
    transition:color .2s, border-color .2s;
  }
  #foot a:hover{
    color:var(--ice);
    border-color:var(--ice);
  }
  #foot .tt{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  #foot .tt svg{width:13px;height:13px;opacity:.85}
  #foot .sep{margin:0 8px;opacity:.35}
</style>
</head>
<body>

<div id="brand">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M13 2 4.5 13.5h6L10 22l8.5-11.5h-6z"/>
    </svg>
  </div>
  <div>
    <div class="name">fro<span>HEN</span></div>
    <div class="tag">PS4 · WebKit Host</div>
  </div>
</div>

<div id="wrap">
  <div id="state"><span id="dot"></span>detecting firmware...</div>
  <div id="det"></div>

  <button id="jb" type="button">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M13 2 4.5 13.5h6L10 22l8.5-11.5h-6z"/>
    </svg>
    <span class="lbl">JAILBREAK</span>
  </button>
  <div id="hint"></div>

  <div id="cache"></div>
</div>

<div id="foot">
  <span class="tt">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M16.6 5.8a4.7 4.7 0 0 1-3-1.1V15a5.2 5.2 0 1 1-4.5-5.1v2.6a2.6 2.6 0 1 0 1.9 2.5V2h2.4a4.8 4.8 0 0 0 3.2 3.8z"/>
    </svg>
    <a href="https://tiktok.com/@v.s.o.3" target="_blank" rel="noopener">@v.s.o.3</a>
  </span>
  <span class="sep">·</span>
  <span>froHEN</span>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl   = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var btnEl   = document.getElementById("jb");
    var hintEl  = document.getElementById("hint");

    function setDot(c) {
        var d = document.getElementById("dot");
        if (d) d.className = c || "";
    }
    function setState(t, c) {
        stateEl.innerHTML = '<span id="dot" class="' + (c || "") + '"></span>' + t;
        stateEl.className = c || "";
    }
    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
    }
    function showButton(hint) {
        btnEl.classList.add("show");
        if (hint) {
            hintEl.textContent = hint;
            hintEl.classList.add("show");
        }
    }
    function hideButton() {
        btnEl.classList.remove("show");
        hintEl.classList.remove("show");
    }

    var params  = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key   = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced    = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    var armed  = false;

    function fire() {
        if (armed) return;
        armed = true;
        btnEl.disabled = true;
        btnEl.querySelector(".lbl").textContent = "LOADING...";
        setState("loading jailbreak...", "warn");
        location.replace(target);
    }
    btnEl.addEventListener("click", fire);

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        showButton("press X on the button to run anyway");
        return;
    }

    setState("ready", "ok");
    showButton("tap the button to start the exploit");

    // Cache warm-up in the background (does not auto-run).
    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setCache("online -- not cached");
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
    } else if (ac.status === ac.UPDATEREADY) {
        setCache("update ready -- reload to apply");
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update cached", true);
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
        }, false);
    }
})();
</script>
</body>
</html>
